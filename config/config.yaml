# 当前激活的环境，切换环境只需改这一行
test_env: "local"

envs:
  local:
    base_url: "http://127.0.0.1:5000/api"
    timeout: 10
  dev:
    base_url: "https://reqres.in/api"
    timeout: 30
  test:
    base_url: "https://test-api.example.com"
    timeout: 20
  prod:
    base_url: "https://api.example.com"
    timeout: 10

# 顶层不再放 base_url，统一由 envs[test_env] 决定