name: API Autotest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pwd
          MYSQL_DATABASE: autotest_db
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_general_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: ci_root_pwd
      DB_NAME: autotest_db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init schema (utf8mb4)
        run: |
          python - <<'PY'
          import os, time, pymysql
          cfg = dict(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              database=os.environ["DB_NAME"],
          )
          sql = open("sql/init.sql", encoding="utf-8").read()
          for attempt in range(12):
              try:
                  conn = pymysql.connect(**cfg)
                  break
              except pymysql.err.OperationalError:
                  time.sleep(2)
          else:
              raise SystemExit("MySQL 未能就绪")
          with conn, conn.cursor() as cur:
              for stmt in filter(None, [s.strip() for s in sql.split(";")]):
                  cur.execute(stmt)
              conn.commit()
              cur.execute("SHOW CREATE TABLE users")
              print(cur.fetchone()[1])
          PY


      - name: Run pytest
        run: pytest --alluredir=allure-results --cov=utils --cov=mock_server --cov-report=term-missing --cov-report=xml
        env:
          TEST_ENV: ci
          DB_NAME: reqres_test_ci
        continue-on-error: true


      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxf allure-2.29.0.tgz
          echo "$PWD/allure-2.29.0/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report
          ls -la allure-report

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
          name: github-pages
          retention-days: 1

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4